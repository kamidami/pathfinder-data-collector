[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathfinder-data-collector"
version = "0.1.0"
description = "Evidence-backed university programme data collection foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1", "ruff>=0.5,<1"]

[project.scripts]
pathfinder-collector = "pathfinder_collector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pathfinder_collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pathfinder_collector/cli.py" = ["B008"]
